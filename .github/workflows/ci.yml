name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build client bundle
        run: node build.mjs

      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js

      - name: Run unit tests
        run: node --test test/*.test.mjs
